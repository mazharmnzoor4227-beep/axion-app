name: Verify Build (v0.8.4)
on:
  push:
    branches: [axion-v084]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK packages
        run: |
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort | tail -1)
          yes | $SDKM --licenses > /dev/null 2>&1 || true
          $SDKM "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;26.3.11579264"
      - name: Assemble debug + run unit tests
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest --continue --no-daemon --stacktrace
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/test-results/testDebugUnitTest/*.xml
# v0.8.4: system notification phone-control surface (owner correction)
